<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110f" />
    <title>Space Attack — Incoming Wave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/pages/new-wave-screen.css" />
    <script src="./scripts/components/arcade-ui.js" defer></script>
    <script src="./scripts/audio/sound-engine.js" defer></script>
    <script src="./scripts/navigation/screen-router.js" defer></script>
    <script src="./scripts/start-screen.js" defer></script>
    <script src="./scripts/gameplay-preview.js" defer></script>
    <script src="./scripts/game/progression.js" defer></script>
    <script src="./scripts/game/destruction-effects.js" defer></script>
    <script src="./scripts/game/game-runtime.js" defer></script>
  </head>
  <body data-audio-screen="new-wave">
    <main class="new-wave-screen" aria-label="Incoming wave preview">
      <score-readout mode="new-wave" label="SCORE" zeros="00" value="6140"></score-readout>

      <section class="new-wave-field" aria-label="Incoming wave announcement">
        <div class="new-wave-banner">
          <div class="new-wave-banner__main">
            <p class="new-wave__label new-wave-banner__eyebrow">INCOMING — GET READY</p>
            <h1 class="new-wave-banner__title"><span>W</span><span class="new-wave-banner__number">04</span></h1>
          </div>
          <wave-updates speed="+15%" fire-rate="+10%" clear-bonus="+500"></wave-updates>
        </div>

        <countdown-timer seconds="5" wave="04"></countdown-timer>
      </section>

      <aside class="new-wave-hull" aria-label="Hull 70 percent">
        <p class="new-wave__label">HULL <span>70%</span></p>
      </aside>
    </main>
  </body>
</html>
