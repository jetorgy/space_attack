<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110f" />
    <title>Space Attack — Paused</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/pages/pause-screen.css" />
    <script src="./scripts/components/arcade-ui.js" defer></script>
    <script src="./scripts/audio/sound-engine.js" defer></script>
    <script src="./scripts/navigation/screen-router.js" defer></script>
    <script src="./scripts/start-screen.js" defer></script>
    <script src="./scripts/gameplay-preview.js" defer></script>
    <script src="./scripts/game/progression.js" defer></script>
    <script src="./scripts/game/destruction-effects.js" defer></script>
    <script src="./scripts/game/game-runtime.js" defer></script>
  </head>
  <body data-audio-screen="pause">
    <main class="pause-screen" aria-label="Paused game screen preview">
      <score-readout mode="pause" label="SCORE" zeros="00" value="4820"></score-readout>

      <section class="pause-playfield" aria-label="Paused playfield preview">
        <nav class="pause-menu" aria-labelledby="pause-title">
          <header class="pause-menu__header">
            <h1 class="pause-menu__title" id="pause-title">PAUSED</h1>
            <span class="pause-menu__state">P</span>
          </header>
          <arcade-button variant="pause" active index="01" label="RESUME" hint="P" href="./gameplay.html"></arcade-button>
          <arcade-button variant="pause" index="02" label="RESTART" hint="R" href="./gameplay.html?restart=1"></arcade-button>
          <arcade-button variant="pause" index="03" label="MAIN MENU" hint="ESC" href="./index.html"></arcade-button>
        </nav>
      </section>

      <aside class="pause-readout pause-readout--hull">
        <p class="pause-readout__label">HULL <span>70%</span></p>
      </aside>
    </main>
  </body>
</html>
