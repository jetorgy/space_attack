<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110f" />
    <title>Space Attack — Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/pages/start-screen.css" />
    <script src="./scripts/components/arcade-ui.js" defer></script>
    <script src="./scripts/audio/sound-engine.js" defer></script>
    <script src="./scripts/navigation/screen-router.js" defer></script>
    <script src="./scripts/start-screen.js" defer></script>
    <script src="./scripts/gameplay-preview.js" defer></script>
    <script src="./scripts/game/progression.js" defer></script>
    <script src="./scripts/game/destruction-effects.js" defer></script>
    <script src="./scripts/game/game-runtime.js" defer></script>
  </head>
  <body data-audio-screen="start">
    <main class="start-screen" aria-label="Space Attack start screen">
      <header class="start-screen__header">
        <p class="start-screen__edition">SA-01 <span aria-hidden="true">/</span> ARCADE</p>
        <score-readout mode="header" label="HI-SCORE" zeros="0" live="15" suffix="300"></score-readout>
      </header>

      <section class="start-screen__main" aria-label="Game title and controls">
        <arcade-title variant="start"></arcade-title>

        <control-panel mode="start"></control-panel>
      </section>

      <arcade-button variant="launch" label="PRESS ENTER TO LAUNCH" wave="01" href="./gameplay.html"></arcade-button>
    </main>
  </body>
</html>
